<includeonly><div id="spirit-import" class="spirit-import-container" data-list="{{{1|travel_spirit_cn}}}">
  <div class="spirit-import-header">
    <div class="spirit-import-title">
      <span>✨</span> 光之翼数据同步
    </div>
    <div class="spirit-import-desc">输入光遇角色数字 ID，快速点亮并同步全量光翼至复刻收集进度库</div>
  </div>

  <div class="spirit-import-route-selector">
    <span class="route-label">线路选择：</span>
    <label class="route-radio-item">
      <input type="radio" name="spirit_route" value="direct" checked />
      <span>国内直连 (推荐)</span>
    </label>
    <label class="route-radio-item">
      <input type="radio" name="spirit_route" value="cf" />
      <span>Cloudflare 加速</span>
    </label>
  </div>

  <div class="spirit-import-form">
    <input id="spirit-import-uid" class="spirit-import-input" type="text" placeholder="游戏 ID，例如 137106295" value="137106295" />
    <button id="spirit-import-query" class="spirit-import-btn">一键同步</button>
  </div>

  <div id="spirit-import-prompt" class="spirit-import-prompt"></div>

  <div class="spirit-import-footer">
    <div class="spirit-import-author">技术支持：<a href="https://space.bilibili.com/34318934" target="_blank" rel="noopener noreferrer" class="credit-link">VincentZyu</a></div>
    <div class="spirit-import-service" id="spirit-import-service-label">当前线路：国内直连 (自动双线容灾)</div>
  </div>
</div>

<style>
  .spirit-import-container {
    margin: 1.2em 0;
    padding: 18px 20px;
    background: #ffffff;
    border: 1px solid #dbe2ef;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(74, 93, 201, 0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #2c3e50;
    box-sizing: border-box;
  }
  .spirit-import-header {
    margin-bottom: 12px;
  }
  .spirit-import-title {
    font-size: 17px;
    font-weight: 700;
    color: #4a5dc9;
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.2;
  }
  .spirit-import-desc {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
    line-height: 1.4;
  }
  .spirit-import-route-selector {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 10px;
    font-size: 13px;
    color: #475569;
  }
  .route-label {
    font-weight: 600;
    color: #334155;
  }
  .route-radio-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
  }
  .route-radio-item input {
    cursor: pointer;
    accent-color: #4a5dc9;
  }
  .spirit-import-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .spirit-import-input {
    flex: 1 1 220px;
    padding: 9px 12px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 14px;
    color: #1e293b;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box;
  }
  .spirit-import-input:focus {
    outline: none;
    background: #ffffff;
    border-color: #4a5dc9;
    box-shadow: 0 0 0 3px rgba(74, 93, 201, 0.15);
  }
  .spirit-import-btn {
    padding: 9px 20px;
    background: #4a5dc9;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
    user-select: none;
    white-space: nowrap;
  }
  .spirit-import-btn:hover {
    background: #3b4cb8;
  }
  .spirit-import-btn:active {
    transform: scale(0.98);
  }
  .spirit-import-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .spirit-import-prompt {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .spirit-prompt-ok {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    border-left: 4px solid #22c55e;
    color: #166534;
  }
  .spirit-prompt-warn {
    background: #fffbeb;
    border: 1px solid #fef08a;
    border-left: 4px solid #eab308;
    color: #854d0e;
  }
  .spirit-prompt-err {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-left: 4px solid #ef4444;
    color: #991b1b;
  }
  .spirit-prompt-banner {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .spirit-stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .spirit-stat-item {
    background: rgba(74, 93, 201, 0.06);
    border: 1px solid rgba(74, 93, 201, 0.2);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
  }
  .spirit-stat-label {
    font-size: 12px;
    color: #2c3e50;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .spirit-stat-value {
    font-size: 24px;
    font-weight: 800;
    color: #4a5dc9;
    line-height: 1.1;
  }
  .spirit-import-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
  }
  .spirit-import-author b,
  .spirit-import-author .credit-link {
    color: #4a5dc9;
    font-weight: 600;
    text-decoration: none;
  }
  .spirit-import-author .credit-link:hover {
    text-decoration: underline;
    color: #3b4cb8;
  }
  .spirit-import-service {
    color: #64748b;
  }
</style>

<script>
(function () {
  if (window.__spiritImportInited) return;
  window.__spiritImportInited = true;

  const root = document.getElementById("spirit-import");
  if (!root) return;

  function resolveListName() {
    const raw = String(root.dataset.list || "").trim();
    const m = raw.match(/^\{\{\{\s*1\s*\|([^}]*)\}\}\}$/);
    const candidate = (m ? m[1] : raw).trim();
    return /^[A-Za-z0-9_\-]+$/.test(candidate) ? candidate : "travel_spirit_cn";
  }

  const LIST_NAME = resolveListName();
  const OPTION_KEY = "userjs-collectionList-" + LIST_NAME;

  const ROUTES = {
    direct: { name: "国内直连", url: "https://guangyi.vincentzyu233.cn" },
    cf:     { name: "Cloudflare加速", url: "https://cf-guangyi.vincentzyu233.cn" }
  };

  const PREFIX_MAP = "l_";
  const PREFIX_PERMANENT = "s_";

  const $uid = document.getElementById("spirit-import-uid");
  const $prompt = document.getElementById("spirit-import-prompt");
  const $btnQuery = document.getElementById("spirit-import-query");
  const $serviceLabel = document.getElementById("spirit-import-service-label");

  function getSelectedRouteKey() {
    const checked = document.querySelector('input[name="spirit_route"]:checked');
    return (checked && checked.value === "cf") ? "cf" : "direct";
  }

  function showPrompt(kind, html) {
    $prompt.className = "spirit-import-prompt " + (
      kind === "ok" ? "spirit-prompt-ok" :
      kind === "err" ? "spirit-prompt-err" : "spirit-prompt-warn"
    );
    $prompt.innerHTML = html;
    $prompt.style.display = "block";
  }

  async function fetchWithTimeout(url, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      return res;
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  function parsePayload(payload) {
    if (!payload || payload.success !== true) throw new Error("响应 success 不为 true");
    const data = payload.data || {};
    if (data.code !== 200) throw new Error("接口返回 code " + data.code + "：" + (data.errmsg || ""));
    let inner;
    try {
      inner = typeof data.result === "string" ? JSON.parse(data.result) : data.result;
    } catch (e) {
      throw new Error("data.result 不是合法 JSON");
    }
    if (!inner || inner.result !== "ok") throw new Error("业务结果非 ok：" + (inner && inner.result));
    if (!Array.isArray(inner.wing_buffs)) throw new Error("缺少 wing_buffs 数组");
    return inner.wing_buffs;
  }

  function extractNames(spiritBuffs) {
    return Array.from(new Set(
      spiritBuffs
        .filter(s => s && s.collected === true)
        .map(s => String(s.name || "").trim())
        .filter(Boolean)
    )).sort();
  }

  function countByPrefix(names) {
    return {
      total: names.length,
      map: names.filter(n => n.startsWith(PREFIX_MAP)).length,
      permanent: names.filter(n => n.startsWith(PREFIX_PERMANENT)).length,
    };
  }

  async function overwriteOption(names) {
    const api = new mw.Api();
    const info = await api.get({
      action: "query", format: "json", formatversion: 2,
      meta: "userinfo", uiprop: "options",
    });
    const userinfo = info && info.query && info.query.userinfo;
    if (!userinfo || userinfo.anon) throw new Error("请先登录后再导入");

    await api.postWithToken("csrf", {
      action: "options", format: "json",
      optionname: OPTION_KEY, optionvalue: names.join(","),
    });
  }

  $btnQuery.addEventListener("click", async () => {
    const uid = ($uid.value || "").trim();
    if (!uid) { showPrompt("warn", "⚠️ 请先填写游戏 ID。"); return; }

    const primaryKey = getSelectedRouteKey();
    const fallbackKey = primaryKey === "direct" ? "cf" : "direct";
    const primary = ROUTES[primaryKey];
    const fallback = ROUTES[fallbackKey];

    $btnQuery.disabled = true;
    showPrompt("warn", `⏳ 正在通过【${primary.name}】检索网易大神光翼数据并校验……`);
    if ($serviceLabel) $serviceLabel.textContent = `当前线路：${primary.name}`;

    let res = null;
    let usedRouteName = primary.name;

    try {
      // 尝试首选线路（6秒超时）
      try {
        res = await fetchWithTimeout(primary.url + "/queryGuangyi?id=" + encodeURIComponent(uid), 6000);
        if (!res.ok) throw new Error("HTTP " + res.status);
      } catch (primaryErr) {
        // 自动故障转移：切换备用线路重试
        showPrompt("warn", `⚠️ 【${primary.name}】连接超时或波动，正在自动切换至【${fallback.name}】重试……`);
        usedRouteName = fallback.name;
        if ($serviceLabel) $serviceLabel.textContent = `当前线路：${fallback.name} (自动切换)`;
        res = await fetchWithTimeout(fallback.url + "/queryGuangyi?id=" + encodeURIComponent(uid), 8000);
        if (!res.ok) throw new Error("HTTP " + res.status);
      }

      const rawData = await res.json();
      const spiritBuffs = parsePayload(rawData);
      const names = extractNames(spiritBuffs);
      if (names.length === 0) {
        showPrompt("warn", "⚠️ 接口未返回任何已收集项（collected=true），未做任何写入。");
        return;
      }
      await overwriteOption(names);
      const { total, map, permanent } = countByPrefix(names);
      showPrompt("ok", `
        <div class="spirit-prompt-banner">✅ 同步成功！已点亮并写入 Wiki 个人收集库（${usedRouteName}）</div>
        <div class="spirit-stats-grid">
          <div class="spirit-stat-item">
            <div class="spirit-stat-label">总收集光之翼</div>
            <div class="spirit-stat-value">${total}</div>
          </div>
          <div class="spirit-stat-item">
            <div class="spirit-stat-label">地图光之翼</div>
            <div class="spirit-stat-value">${map}</div>
          </div>
          <div class="spirit-stat-item">
            <div class="spirit-stat-label">永久光之翼</div>
            <div class="spirit-stat-value">${permanent}</div>
          </div>
        </div>
      `);
    } catch (e) {
      showPrompt("err", "❌ 同步失败：" + (e && e.message ? e.message : e));
    } finally {
      $btnQuery.disabled = false;
    }
  });
})();
</script></includeonly><noinclude>{{#Widget:SynSpirit}}</noinclude>
